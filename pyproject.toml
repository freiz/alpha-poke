[project]
name = "alpha-poke"
version = "0.1.0"
description = "Reinforcement learning / ML agents for competitive Pokémon battles, built on poke-env"
authors = [
    { name = "freiz", email = "freizsu@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alpha-search",
    "pandas>=3.0.6",
    "poke-engine==0.0.48",
    "poke-env>=0.16.1",
    "pyarrow>=25.0.1",
]

[project.scripts]
alpha-poke = "alpha_poke.cli:main"

[build-system]
requires = ["uv_build>=0.11.16,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]
train = [
    "safetensors>=0.8.0",
    "torch>=2.14.1",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv.config-settings-package]
# poke-engine (MIT, Rust): build the Gen 9 engine with terastallization
poke-engine = { "build-args" = "--features poke-engine/terastallization --no-default-features" }

[tool.uv.sources]
# our Rust search crate (design D12), built with maturin; poke-engine comes from crates.io
alpha-search = { path = "rust/alpha_search" }
