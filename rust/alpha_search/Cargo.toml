[package]
name = "alpha_search"
version = "0.1.0"
edition = "2021"
publish = false
description = "Search for alpha-poke (ISMCTS over belief-sampled worlds) on top of poke-engine"

[lib]
name = "alpha_search"
crate-type = ["cdylib", "rlib"]

[dependencies]
# MIT; must be built exactly like the Python `poke-engine` package (pyproject.toml:
# --no-default-features --features terastallization, which implies gen9) so that state strings
# from poke_engine.State.to_string() parse identically here.
poke-engine = { version = "=0.0.48", default-features = false, features = ["terastallization"] }
# extension-module is enabled by maturin only (pyproject.toml), so `cargo test` can link
pyo3 = "0.29"
rand = "0.9"
rand_distr = "0.5"
rustc-hash = "2"
safetensors = "0.8.0"
serde_json = "1.0.151"

[profile.release]
debug = 1

# poke-engine with one change (`before_move` public), see rust/patches/poke-engine-0.0.48
[patch.crates-io]
poke-engine = { path = "../patches/poke-engine-0.0.48" }
