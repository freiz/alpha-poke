name: Windows app

# The review app for Windows (alpha_poke.coach.launcher): Python, the libraries and the two Rust
# extensions frozen by PyInstaller with the released model, the belief models and Smogon's usage
# statistics -- nothing to install for the user. Run by hand (optionally attached to a release).

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "attach the zip to this release (empty: the run's artifact only)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 75
    env:
      # a portable build: AVX2 / FMA (x86-64-v3, 2013 on), not the build machine's own CPU
      # (rust/alpha_search/.cargo/config.toml's target-cpu=native, overridden)
      RUSTFLAGS: "-C target-cpu=x86-64-v3"
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95.0"
      - uses: astral-sh/setup-uv@v6
      - name: environment (the project's own dependencies: no torch, no dev tools)
        run: |
          uv sync --locked --no-default-groups
          uv pip install "pyinstaller>=6.10"
      - name: assets (the release's network and belief models, SHA-256 checked; Smogon 2026-09)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ALPHA_DATA: build/assets
        run: uv run --no-sync python scripts/fetch_model.py
      - name: freeze
        shell: bash
        run: >
          uv run --no-sync pyinstaller --noconfirm --clean --onedir --console
          --name alpha-poke-review --paths src
          --collect-submodules alpha_poke --collect-data poke_env
          --add-data "build/assets;assets"
          packaging/windows/review_app.py
      - name: smoke test (the frozen app reviews a fixture replay end to end)
        shell: bash
        run: |
          export LOCALAPPDATA="$RUNNER_TEMP/appdata"
          ./dist/alpha-poke-review/alpha-poke-review.exe > app.log 2>&1 &
          uv run --no-sync python packaging/windows/smoke_test.py
      - name: zip
        shell: pwsh
        run: Compress-Archive -Path dist/alpha-poke-review/* -DestinationPath alpha-poke-review-windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: alpha-poke-review-windows-x64
          path: alpha-poke-review-windows-x64.zip
          retention-days: 14
      - name: attach to the release
        if: ${{ inputs.release_tag != '' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ inputs.release_tag }}" alpha-poke-review-windows-x64.zip --clobber
      - name: the app's log (on failure)
        if: failure()
        shell: bash
        run: cat app.log || true
